
name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -o shinra-github-source.zip -d build-source

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check web source
        run: node build-source/scripts/check-web.mjs

      - name: Build APK
        working-directory: build-source/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Package APK
        run: cp build-source/android/app/build/outputs/apk/debug/app-debug.apk shinra-kichijitsu-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shinra-android-apk
          path: shinra-kichijitsu-debug.apk
